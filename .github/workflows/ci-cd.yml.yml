name: CI/CD Pipeline

on:
  push:
    branches: [ master ] 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Build the Docker image
      run: docker build . -t eordyan/ciup-wash-bot:${{ github.sha }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push the Docker image to Docker Hub
      run: docker push eordyan/ciup-wash-bot:${{ github.sha }}

    - name: Create .kube directory
      run: mkdir -p $HOME/.kube

    - name: Set up kubeconfig
      run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

    - name: Verify .kube/config setup
      run: |
        ls -l $HOME/.kube/config
        echo "Config file size:"
        wc -l $HOME/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f deploy/persistentVolume.yaml
        kubectl apply -f deploy/PersistentVolumeClaim.yaml
        kubectl apply -f deploy/deployment.yaml
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
